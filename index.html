<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card de Perfil</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-zinc-950 flex min-h-screen items-center justify-center p-4">

    <div
        class="w-80 h-[500px] flex flex-col items-center justify-between rounded-3xl bg-zinc-900/80 backdrop-blur-md p-6 shadow-2xl border border-zinc-800 text-center">

        <div class="flex-1 flex flex-col items-center justify-center gap-3">
            <img class="w-60 h-60 rounded-2xl object-cover shadow-lg border border-zinc-700" src="tiquinho.jpg"
                alt="Tiquinho Soares">

            <h2 class="text-xl font-bold leading-tight text-zinc-100 pt-2">
                Bernardo de Paula Rodrigues
            </h2>
        </div>

        <div class="w-full bg-zinc-800/60 py-3 rounded-xl border border-zinc-700/50 mt-4 shrink-0">
            <p class="text-xs uppercase tracking-wider text-zinc-400 font-semibold">Registro de Matrícula</p>
            <p class="text-lg font-mono font-bold text-zinc-200">572376</p>
        </div>

    </div>

</body>

</html>
